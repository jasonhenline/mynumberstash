project_id = "number-collection"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.game-api]
# The handler validates the bearer token with Auth.getUser on every request.
# This also supports newer asymmetric signing keys and browser preflight requests.
verify_jwt = false
entrypoint = "./functions/game-api/index.ts"
